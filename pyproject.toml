[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pindocs"
version = "0.1.1"
description = "A grouped, try-it-out API console for FastAPI, with pinned values that outlive restarts."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tomas Laurin" }]
keywords = ["fastapi", "openapi", "documentation", "api-console", "swagger", "pindocs"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
]
dependencies = ["fastapi>=0.100"]

[project.urls]
Homepage = "https://github.com/TomasLaurin/pindocs"
Issues = "https://github.com/TomasLaurin/pindocs/issues"

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6", "uvicorn>=0.30"]

[tool.hatch.build.targets.wheel]
packages = ["src/pindocs"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE"]

[tool.ruff]
line-length = 130
# Keep in step with requires-python: at py311 the UP ruleset rewrites
# timezone.utc back to datetime.UTC, which 3.10 does not have.
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
