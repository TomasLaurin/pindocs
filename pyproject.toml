[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastapi-docs"
version = "0.1.0"
description = "A grouped, try-it-out API console for FastAPI, with values that outlive restarts."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Tomas Laurin" }]
keywords = ["fastapi", "openapi", "documentation", "api-console", "swagger"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
]
dependencies = ["fastapi>=0.100"]

[project.urls]
Homepage = "https://github.com/TomasLaurin/fastapi-docs"
Issues = "https://github.com/TomasLaurin/fastapi-docs/issues"

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6", "uvicorn>=0.30"]

[tool.hatch.build.targets.wheel]
packages = ["src/fastapi_docs"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE"]

[tool.ruff]
line-length = 130
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
