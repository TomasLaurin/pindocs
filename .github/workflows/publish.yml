# Publishes to PyPI on every v* tag, via PyPI trusted publishing — no API token
# lives in this repository. One-time setup on pypi.org before the first tag: the
# project does not exist yet, so it is a *pending* publisher
# (pypi.org/manage/account/publishing/), not one added from a project page —
# owner TomasLaurin, repository pindocs, workflow publish.yml, environment pypi.
# The repository name is the one GitHub reports today: a rename changes the OIDC
# claim, and the publisher has to be updated to match or the upload is rejected.
# https://docs.pypi.org/trusted-publishers/
name: publish

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Naming any permission drops every unnamed one to `none`, so `contents:
      # read` has to be spelled out or checkout cannot read the repository.
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev
      - run: uv run pytest
      - run: uv run ruff check src tests examples
      - run: uv build
      - run: uv publish
